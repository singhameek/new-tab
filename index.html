<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
</head>
<body class="body">
    <!--CLOCK-->
    <div class="clock" id="clock">00:00:00</div>
    <!--GREETING-->
    <h1 id="greeting" class="greeting"></h1>

    <!--SEARCH BAR-->
    <div class = "inputcont">
        <input placeholder="Search..." id="input" class="input" type="text">
    </div>

    <!--BOOKMARKS-->
    <div class="bookmarks">
        <a href="https://mail.google.com" class="bookmark_btn" target="_blank">Gmail</a>
        <a href="https://www.youtube.com" class="bookmark_btn" target="_blank">YouTube</a>
        <a href="https://drive.google.com" class="bookmark_btn" target="_blank">Drive</a>
        <a href="https://gemini.google.com" class="bookmark_btn" target="_blank">Gemini</a>
    </div>

    <!--CALENDAR-->
    <div class="calendar_card">
        <div class="calendar_header">
            <h2 id="month_year">Month Year</h2>
        </div>
        <div class="calendar_weekdays">
            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
        </div>
        <div class="calendar_days" id="calendar_days">

        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
